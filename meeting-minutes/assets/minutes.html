</style></head><body>
<header class="toolbar"><div class="tools"><div><div class="editor-label">会议纪要编辑器</div><div class="hint">点击文字编辑 · 保存 HTML 保留修改</div></div><div class="buttons"><button id="edit-info" class="secondary">会议信息</button><button id="save-html" class="secondary">保存 HTML</button><button id="export-png">导出图片</button></div></div><div id="status" role="status" aria-live="polite"></div></header>
<main class="sheet" id="sheet">
<header class="hero"><div class="eyebrow"><span>会议纪要</span><span class="eyebrow-en">MEETING NOTES</span></div>
<h1 id="topic" class="field topic" contenteditable="true" role="textbox" aria-label="会议主题"></h1>
<div class="metadata"><div class="meta-item" id="time-row"><span class="meta-label">时间</span><div id="meeting-time" class="field meta-value" contenteditable="true" role="textbox" aria-label="会议时间"></div></div><div class="meta-item" id="people-row"><span class="meta-label">参会人</span><div id="participants" class="field meta-value" contenteditable="true" role="textbox" aria-label="参会人"></div></div></div></header>
<div class="content"><section class="overview" id="overview"><div class="overview-label">会议<br>概要</div><div id="summary" class="field summary" contenteditable="true" role="textbox" aria-label="会议概要"></div></section>
<section><div class="section-head"><h2 class="section-title">核心要点</h2><span class="section-count" id="point-count"></span></div><div id="points"></div><button class="add" id="add-point">＋ 添加要点</button></section>
<section class="todo-section"><div class="section-head"><h2 class="section-title">主要 Todo</h2><span class="section-count" id="todo-count"></span></div><div class="table-wrap" id="todos-wrap"><table id="todos-table"><thead><tr><th>事项 / 交付物</th><th>负责人</th><th>期限</th></tr></thead><tbody id="todos"></tbody></table></div><div id="no-todos" class="no-todos" hidden>本次未形成明确待办。</div><button class="add" id="add-todo">＋ 添加 Todo</button></section></div>
</main>
<dialog id="info-dialog" class="info-dialog"><h2>会议信息</h2><label for="info-time">会议时间<input id="info-time" type="text" placeholder="填写日期与时段，可留空"></label><label for="info-people">参会人<input id="info-people" type="text" placeholder="姓名，用顿号分隔"></label><label for="info-summary">会议概要<textarea id="info-summary" rows="4"></textarea></label><p>留空的时间不会出现在纪要和图片中。</p><div class="buttons"><button id="close-info" class="secondary">取消</button><button id="apply-info">应用</button></div></dialog>
<dialog id="image-dialog" class="image-dialog"><div class="dialog-head"><div><strong>图片预览</strong><div id="export-size" class="export-size"></div></div><div class="buttons"><a id="download-image" class="image-download" download>下载 PNG</a><button id="close-preview" class="secondary">关闭</button></div></div><img id="png-preview" alt="会议纪要图片预览"></dialog>
<script type="application/json" id="minutes-data">__MEETING_DATA__</script>
<script>
'use strict';
const seed=JSON.parse(document.querySelector('#minutes-data').textContent);
const $=selector=>document.querySelector(selector);
const element=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
let dirty=false,currentImageObjectURL=null;
function status(value){$('#status').textContent=value}
function changed(){dirty=true;status('有未保存的修改；保存 HTML 可在下次打开时继续编辑。')}

function text(e){return e.innerText.replace(/\u00a0/g,' ').trim()}
function syncCounts(){const rows=[...$('#todos').children];$('#no-todos').hidden=!!rows.length;$('#todos-wrap').hidden=!rows.length;$('#point-count').textContent=`${$('#points').children.length} 个议题`;const done=rows.filter(r=>r.querySelector('input').checked).length;$('#todo-count').textContent=done?`${done} / ${rows.length} 已完成`:`${rows.length} 项行动`}
function syncInfo(){$('#time-row').hidden=!text($('#meeting-time'));$('#people-row').hidden=!text($('#participants'));$('#overview').hidden=!text($('#summary'))}
function pointRow(point){const row=element('article',undefined,'point');row.append(editable(point.title||'要点','要点标题','point-title'),editable(point.text||'','要点内容','point-text'));const remove=element('button','×','delete');remove.setAttribute('aria-label','删除此要点');remove.onclick=()=>{row.remove();syncCounts();changed()};row.append(remove);return row}
function todoRow(todo){const row=element('tr');row.classList.toggle('done',!!todo.done);const cell=element('td'),task=element('div',undefined,'task-cell'),check=element('input');check.type='checkbox';check.checked=!!todo.done;check.setAttribute('aria-label','标记此 Todo 已完成');check.onchange=()=>{row.classList.toggle('done',check.checked);syncCounts();changed()};task.append(check,editable(todo.task||'','Todo 事项','task-text'));cell.append(task);row.append(cell);const owner=element('td');owner.append(editable(todo.owner||'—','Todo 负责人','todo-owner'));row.append(owner);const deadline=element('td');deadline.append(editable(todo.deadline||'—','Todo 期限','todo-deadline'));const remove=element('button','×','delete');remove.setAttribute('aria-label','删除此 Todo');remove.onclick=()=>{row.remove();syncCounts();changed()};deadline.append(remove);row.append(deadline);return row}
function render(data){$('#meeting-time').textContent=data.meeting_time||'';$('#topic').textContent=data.topic||'会议纪要';$('#participants').textContent=data.participants||'';$('#summary').textContent=data.summary||'';$('#points').replaceChildren(...(data.points||[]).map(pointRow));$('#todos').replaceChildren(...(data.todos||[]).map(todoRow));syncCounts();syncInfo();document.title=data.topic||'会议纪要'}
function collect(){return{...seed,meeting_time:text($('#meeting-time')),topic:text($('#topic')),participants:text($('#participants')),summary:text($('#summary')),points:[...$('#points').children].map(row=>({title:text(row.querySelector('.point-title')),text:text(row.querySelector('.point-text'))})),todos:[...$('#todos').children].map(row=>({task:text(row.querySelector('.task-text')),owner:text(row.querySelector('.todo-owner')),deadline:text(row.querySelector('.todo-deadline')),done:row.querySelector('input').checked}))}}
function filename(ext){return(text($('#topic'))||'会议纪要').replace(/[<>:"/\\|?*\x00-\x1f]/g,'-').slice(0,90)+'.'+ext}
function download(url,name){const a=element('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove()}
$('#sheet').addEventListener('input',changed);
$('#sheet').addEventListener('paste',event=>{if(!event.target.closest('[contenteditable]'))return;event.preventDefault();const pasted=event.clipboardData.getData('text/plain'),selection=window.getSelection();if(!selection.rangeCount)return;const range=selection.getRangeAt(0);range.deleteContents();const node=document.createTextNode(pasted);range.insertNode(node);range.setStartAfter(node);range.collapse(true);selection.removeAllRanges();selection.addRange(range);changed()});
$('#edit-info').onclick=()=>{$('#info-time').value=text($('#meeting-time'));$('#info-people').value=text($('#participants'));$('#info-summary').value=text($('#summary'));$('#info-dialog').showModal()};
$('#close-info').onclick=()=>$('#info-dialog').close();
$('#apply-info').onclick=()=>{$('#meeting-time').textContent=$('#info-time').value.trim();$('#participants').textContent=$('#info-people').value.trim();$('#summary').textContent=$('#info-summary').value.trim();syncInfo();changed();$('#info-dialog').close()};
$('#add-point').onclick=()=>{$('#points').append(pointRow({title:'新增要点',text:'填写议题结论或讨论方向'}));syncCounts();changed()};
$('#add-todo').onclick=()=>{$('#todos').append(todoRow({task:'填写事项及交付物',owner:'—',deadline:'—'}));syncCounts();changed()};
$('#save-html').onclick=()=>{const data=collect(),clone=document.documentElement.cloneNode(true);clone.querySelector('#minutes-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');clone.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));clone.querySelector('#png-preview').removeAttribute('src');clone.querySelector('#download-image').removeAttribute('href');clone.querySelector('#status').textContent='';clone.querySelector('#export-png').disabled=false;clone.querySelectorAll('#info-dialog input,#info-dialog textarea').forEach(e=>{e.value='';e.removeAttribute('value');e.textContent=''});const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob);download(url,filename('html'));setTimeout(()=>URL.revokeObjectURL(url),30000);dirty=false;status('已下载可编辑 HTML；下次打开下载的文件即可继续修改。')};

const fontStacks={sans:'"Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif',serif:'"Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif',number:'"Lora", Georgia, "Times New Roman", serif',latin:'"Poppins", -apple-system, sans-serif'};
const font=(size,weight=400,family='sans')=>`${weight} ${size}px ${fontStacks[family]||fontStacks.sans}`;
function wrap(ctx,value,width,size,weight=400,family='sans'){ctx.font=font(size,weight,family);const lines=[];for(const paragraph of String(value||'').split('\n')){let line='';const tokens=paragraph.match(/[A-Za-z0-9][A-Za-z0-9_+./-]*|\s+|[^\s]/gu)||[''];for(const token of tokens){if(ctx.measureText(line+token).width<=width){line+=token;continue}if(line){const chars=Array.from(line);let carry='';if(/^[，。！？；：、）)》〉】」』”’…,.!?;:%]/u.test(token)||/[（(《〈【「『“‘]$/u.test(line)){carry=chars.pop()||'';while(chars.length&&/[（(《〈【「『“‘]/u.test(chars[chars.length-1]))carry=chars.pop()+carry}if(chars.length)lines.push(chars.join('').trimEnd());line=carry}if(ctx.measureText(line+token).width<=width){line+=token.trimStart();continue}for(const character of Array.from(token)){if(line&&ctx.measureText(line+character).width>width){lines.push(line);line=''}line+=character}}lines.push(line.trimEnd())}return lines}
async function makePng(data){if(document.fonts?.ready)await document.fonts.ready;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');if(!ctx)throw Error('此浏览器暂不支持图片导出。');const width=920,pad=48,inner=width-pad*2,ops=[],ink='#30302c',muted='#89867d',secondary='#605e57',accent='#d97757',paper='#faf9f5';let y=32;

 function section(value,note){rect(pad,y+8,3,18,accent);words(value,pad+15,y,inner-170,21,34,500,ink,'serif');ctx.font=font(11);const nw=ctx.measureText(note).width+8;words(note,width-pad-nw,y+8,nw,11,18,400,muted);y+=50;line(pad,y,inner);y+=4}
 rect(0,0,width,2,accent);words('会议纪要',pad,y,200,11,20,500,'#a75d43');words('MEETING NOTES',width-pad-100,y,100,11,20,400,muted,'latin');y+=36;
 y+=words(data.topic||'会议纪要',pad,y,inner,36,52,400,ink,'serif');y+=16;
 for(const [label,value] of [['时间',data.meeting_time],['参会人',data.participants]]){if(!value)continue;words(label,pad,y,42,11,20,500,muted);const h=words(value,pad+54,y,inner-54,12,22,400,secondary);y+=h+4}

 if(data.summary){const bodyH=wrap(ctx,data.summary,inner-48-120,17,400,'serif').length*32,h=Math.max(60,bodyH)+48;rect(pad,y,inner,h,'#f1efe6',8);words('会议\n概要',pad+24,y+24,96,17,30,500,'#a75d43');words(data.summary,pad+144,y+24,inner-168,17,32,400,ink,'serif');y+=h+32}
