# Push a tag such as v11.5.0 to test, package and publish a GitHub Release with both zips.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches MANIFEST version
        run: |
          version=$(python3 -c "import json; print(json.load(open('MANIFEST.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != MANIFEST v$version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run tests
        working-directory: meeting-offline
        env:
          MEETING_OFFLINE_DEVICE_ID: ci
        run: python3 -m unittest discover -s tests

      - name: Build packages
        run: |
          python3 build_package.py --out dist
          git diff --exit-code MANIFEST.json || { echo "MANIFEST.json is stale; run build_package.py and commit"; exit 1; }

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### 下载哪个包

          - `meeting_offline-*-local.zip`：Codex、Claude Code、WorkBuddy、CodeBuddy。解压后运行 `python3 install.py`（Windows：`py -3 install.py`）。
          - `meeting_offline-*-upload.zip`：直接上传到 ChatGPT、Claude.ai，或在 WorkBuddy 里导入。

          详细说明见 [README](https://github.com/${{ github.repository }}#readme)。
          EOF
          test -s notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "meeting_offline $VERSION" --notes-file notes.md
