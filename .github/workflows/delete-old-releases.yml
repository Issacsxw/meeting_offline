# One-off: removes the releases (and their tags) from the old 11.x numbering. Run by hand, then delete this file.
name: Delete old releases

on:
  workflow_dispatch:
    inputs:
      prefix:
        description: Tag prefix of the releases to delete
        default: v11.

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PREFIX: ${{ inputs.prefix }}
    steps:
      - name: Delete matching releases and tags
        run: |
          case "$PREFIX" in v1.*|v1|v|"") echo "refusing prefix '$PREFIX'"; exit 1;; esac
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' > tags.txt
          grep -F -- "$PREFIX" tags.txt | grep "^$PREFIX" > doomed.txt || true
          cat doomed.txt
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done < doomed.txt
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200
